name: Build & Release

# Runs when a v* tag is pushed, OR when you start it by hand from the
# Actions tab ("Run workflow") - which is what you use if you published
# with GitHub Desktop and never pushed a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --mac dmg --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk VansAiStudio-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: VansAiStudio-Android.apk

  release:
    needs: [windows, macos, linux, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # a tag push uses that tag; a manual run creates/updates v1.0.0
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Vans AI Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: artifacts/**
          fail_on_unmatched_files: false
          body: |
            ## Vans AI Studio 🎨

            סטודיו יצירה חופשי — תמונות, וידאו, מוזיקה, תלת־ממד ומודלים. בלי מפתח API.
            Free AI studio — images, video, music, 3D and custom models. No API key needed.

            ### הורדות / Downloads

            | קובץ / File | פלטפורמה / Platform |
            |---|---|
            | `VansAiStudio-Setup-*.exe` | Windows — התקנה / installer |
            | `VansAiStudio-Portable-*.exe` | Windows — נייד / portable |
            | `VansAiStudio-*-mac.dmg` | macOS |
            | `VansAiStudio-*.AppImage` | Linux |
            | `VansAiStudio-Android.apk` | Android |

            אחרי ההתקנה מריצים `vurs` בטרמינל / after installing, just run `vurs`.
